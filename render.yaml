services:
  - type: web
    name: alien-stage-telegram
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: 'unzip -o "AlienStageTelegram-multiplatform (1).zip" -d . && node render-theme/apply-theme.cjs && node render-theme/install-gifts.cjs && cd AlienStageTelegram && npm install --omit=dev'
    startCommand: 'cd AlienStageTelegram && npm start'
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22.23.2"
