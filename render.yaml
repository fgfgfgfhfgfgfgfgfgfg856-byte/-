services:
  - type: web
    name: alien-stage-telegram
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: 'unzip -o "AlienStageTelegram-email-login.zip" -d . && cd AlienStageTelegram && npm install --omit=dev'
    startCommand: 'cd AlienStageTelegram && npm start'
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.5"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alien-stage-telegram-db
          property: connectionString
      - key: EMAIL_FROM
        value: "AlienStageTelegram <onboarding@resend.dev>"
      - key: UNLIMITED_TOKENS_EMAIL
        value: "fgfgfgfhfgfgfgfgfgfg856@gmail.com"
      - key: STARTER_TOKENS
        value: "100"

databases:
  - name: alien-stage-telegram-db
    databaseName: alienstage
    plan: free
    region: frankfurt
